name: Python tests

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt httpx
      - name: Check JavaScript syntax
        run: node --check frontend/js/app.js && node --check frontend/js/weather-explorer.js && node tests/test_markdown_renderer.cjs
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
